services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    image: ghcr.io/${GHCR_OWNER}/events-backend:latest
    restart: unless-stopped
    expose:
      - "8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TokenKey: ${TOKEN_KEY}
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Events;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"

    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

    depends_on:
      sqlserver:
        condition: service_healthy


  frontend:
    image: ghcr.io/${GHCR_OWNER}/events-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_started


volumes:
  sqlserver-data:
  dataprotection-keys: