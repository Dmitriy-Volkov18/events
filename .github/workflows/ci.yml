name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/Events

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Events.slnx

      - name: Format check
        run: dotnet format Events.slnx --verify-no-changes

      - name: Build
        run: dotnet build Events.slnx --configuration Release --no-restore


  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build


  docker:
    name: Docker
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/Events
          file: ./backend/Events/Dockerfile
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./client-app
          file: ./client-app/Dockerfile
          push: false
          build-args: |
            NGINX_CONF=nginx.prod.conf